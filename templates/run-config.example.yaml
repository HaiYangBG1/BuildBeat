# BuildBeat 项目配置样板。拷到项目的 delivery/run-config.yaml，把两处命令换成真实的。
# 它说的是这个项目里一个提交怎么验、怎么审；所有工作共用这一份。
# 路径相对本文件解析。严格 YAML 子集：只有块列表与块映射（列表项可与键同缩进），行内只允许空的 [] / {}，无锚点，注释必须独占一行。
# 写好后：buildbeat check --repo .；送审一个提交：buildbeat review --repo . --work <WORK-ID>
#
# 单项工作要和项目不一样时，在 delivery/work/<WORK-ID>/run-config.yaml 里只写要覆盖的键；那里还能写：
#   allowedPaths：这项工作能改哪些目录（越界的提交记为失败；工作自己的文件夹总是允许）
#   base：这项工作从哪个提交算起（不写就是最后一次改它 work.md 的那个提交）
#   release：声明这项工作要上线，关窗前必须回读通过
#
# 内核把 prompts/<worker>.md 喂给 worker（$BUILDBEAT_PROMPT）；模板见 templates/envelope/prompts/
envelope:
  prompts: envelope/prompts
  vars:
    component: app
# worker 输出落成证据前按这些 JS 正则脱敏（不支持 (?i) 这类内联标志）
redact:
  - "(token|secret|password|TOKEN|SECRET|PASSWORD)=\\S+"
# 开跑前检查环境：缺了就直接报清楚，不白跑一轮
requires:
  - command: node
    min: "20"
# 有 UI 的项目：verify 把真渲染截图以 PNG 写进 $BUILDBEAT_SCREENSHOT_DIR（只收可解码的 PNG），批准时要求这个提交有截图
# requireScreenshot: true
# 上线后由 buildbeat release 在主检出运行的只读回读命令（形状同 worker）；命令从 $BUILDBEAT_RELEASE_ENV 读环境名
# release:
#   command: bash
#   args:
#     - scripts/readback.sh
# worker 以这个提交的临时检出为 cwd 运行；delivery/envelope/worker.sh 已随仓库进检出。
workers:
  # 真实测试命令；环境不满足就 exit 75（记为工具故障，不算这个提交的问题）
  verifier:
    command: bash
    args:
      - -lc
      - npm test
  # 只读审查。换工具只改 `--` 后面的命令：codex exec … / claude -p … / 任意脚本
  reviewer:
    command: bash
    args:
      - delivery/envelope/worker.sh
      - reviewer
      - --
      - codex
      - exec
      - -s
      - read-only
