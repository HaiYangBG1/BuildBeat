# Invariant 22 (lessons.md「静态稿拍板 → 返工螺旋」, machine form): a UI delivery's spec approval
# subject must include renderable proof — a screenshot with a digest —
# before a human may stamp it. Static prose is not an approvable design.
kind: policy
version: 1
name: ui-render-gate
type: transition
appliesTo: enter-spec
enforcement: LOCAL_ENFORCED
rule:
  evidence.exists:
    kind: screenshot
    minGrade: L2
