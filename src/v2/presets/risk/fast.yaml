# Fast lane: automatic plan/build/verify/review, human merge decision only.
# The merge gate still demands read-back evidence and a clean review.
kind: risk-preset
version: 1
name: fast
policies:
  - kind: policy
    version: 1
    name: merge-evidence-floor
    type: transition
    appliesTo: enter-wait-merge
    enforcement: LOCAL_ENFORCED
    rule:
      all:
        - evidence.exists:
            kind: command
            minGrade: L2
        - finding.maxSeverity:
            atMost: P2
