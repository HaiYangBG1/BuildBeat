# Run config for WORK-DELIVERY-BINARIES. Paths resolve relative to this file.
# Builder and fixer are deliberately absent: the driving session writes the
# change and hands each commit over with --adopt. Verify runs the full local
# gate; review is the shipped reviewer prompt on codex, read-only.
repo: ../../..
work: WORK-DELIVERY-BINARIES
run: RUN-DELIVERY-BINARIES
allowedPaths:
  - src
  - tests
  - CHANGELOG.md
  - templates/gitignore.template
  - example/gitignore.template
  - docs/v2/guide
  - SKILL.md
  - README.md
  - README.en.md
reviewTriage: off
budgets:
  reviewRoundsPerWork: 6
parallel: true
cache:
  verify: tree
envelope:
  prompts: ../../../templates/v2/envelope/prompts
  vars:
    component: buildbeat
redact:
  - "(token|secret|password|TOKEN|SECRET|PASSWORD)=\\S+"
requires:
  - command: node
    min: "20"
  - command: codex
workers:
  verifier:
    command: bash
    timeoutMs: 1800000
    args:
      - delivery/work/WORK-DELIVERY-BINARIES/verify.sh
  reviewer:
    command: bash
    timeoutMs: 3600000
    args:
      - delivery/envelope/worker.sh
      - reviewer
      - --
      - codex
      - exec
      - -s
      - read-only
