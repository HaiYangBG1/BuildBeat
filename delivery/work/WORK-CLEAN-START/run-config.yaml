# Run config for WORK-CLEAN-START. Paths resolve relative to this file.
# Builder and fixer are deliberately absent: the driving session writes the
# change and hands each commit over with --adopt. Verify runs the full local
# gate plus the acceptance checks in work.md; review is the shipped reviewer
# prompt on codex, read-only.
repo: ../../..
work: WORK-CLEAN-START
run: RUN-CLEAN-START
allowedPaths:
  - src
  - tests
  - docs
  - templates
  - example
  - plugins
  - evals
  - SKILL.md
  - README.md
  - README.en.md
  - CONTRIBUTING.md
  - CHANGELOG.md
  - CHANGELOG-v1.md
  - package.json
reviewTriage: off
budgets:
  reviewRoundsPerWork: 6
cache:
  verify: tree
envelope:
  prompts: ../../../templates/v2/envelope/prompts
  vars:
    component: buildbeat
redact:
  - "(token|secret|password|TOKEN|SECRET|PASSWORD)=\\S+"
requires:
  - command: node
    min: "20"
  - command: codex
workers:
  verifier:
    command: bash
    timeoutMs: 1800000
    args:
      - delivery/work/WORK-CLEAN-START/verify.sh
  reviewer:
    command: bash
    timeoutMs: 3600000
    args:
      - delivery/envelope/worker.sh
      - reviewer
      - --
      - codex
      - exec
      - -s
      - read-only
