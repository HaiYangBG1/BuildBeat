name: Publish BuildBeat scoped npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated release tag, for example v1.21.0
        required: true
        type: string

permissions:
  contents: read

env:
  BUILDBEAT_PACKAGE_NAME: "@haiyangbg/buildbeat"

# One publication at a time across all tags: a stable release reads next and
# then moves it, and a pre-release published in between must not be lost.
# queue: max keeps every waiting publication (the default keeps one and
# cancels the rest).
concurrency:
  group: npm-publish
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Publish ${{ inputs.tag }} to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install the pinned OIDC-capable npm CLI
        run: npm install --global npm@11.21.2

      - name: Validate tag, ancestry, and package version
        id: policy
        shell: bash
        run: |
          set -euo pipefail
          # Stable releases publish from main to dist-tag latest. Pre-release
          # versions (e.g. v2.0.0-beta.1) publish from the exact origin tip of
          # the dispatching release branch to dist-tag next; latest never moves
          # on a pre-release.
          if [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            release_channel=stable
            dist_tag=latest
          elif [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$ ]]; then
            release_channel=prerelease
            dist_tag=next
          else
            echo "Release tag must use vMAJOR.MINOR.PATCH with an optional pre-release suffix." >&2
            exit 1
          fi

          dispatch_branch="${GITHUB_REF#refs/heads/}"
          test "$GITHUB_REF" = "refs/heads/$dispatch_branch"
          if [[ "$release_channel" = "stable" ]]; then
            test "$dispatch_branch" = "main"
          fi
          git fetch --no-tags origin "$dispatch_branch:refs/remotes/origin/$dispatch_branch"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # A new publication comes from the branch tip. Once this exact
          # version is on the registry (a re-run after a failed later step),
          # the commit only has to stay in the branch's history: publishing
          # then accepts nothing but the identical artifact.
          release_version="${RELEASE_TAG#v}"
          if [[ "$(npm view "$BUILDBEAT_PACKAGE_NAME@$release_version" version 2>/dev/null || true)" = "$release_version" ]]; then
            git merge-base --is-ancestor HEAD "refs/remotes/origin/$dispatch_branch"
          else
            test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$dispatch_branch")"
          fi

          package_version="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./package.json').name")" = "$BUILDBEAT_PACKAGE_NAME"
          test "$RELEASE_TAG" = "v$package_version"
          test -z "$(git status --porcelain=v1)"
          printf 'dist_tag=%s\n' "$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Install package metadata
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Re-run release checks
        run: |
          npm test
          npm run check:docs
          npm run pack:check
          test -z "$(git status --porcelain=v1)"

      - name: Pack the exact release candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          candidate_dir="$RUNNER_TEMP/buildbeat-candidate"
          mkdir -p "$candidate_dir"
          pack_json="$(npm pack --json --pack-destination "$candidate_dir")"
          package_file="$(node -e 'const value=JSON.parse(process.argv[1]); if (!Array.isArray(value) || value.length !== 1) process.exit(1); process.stdout.write(value[0].filename)' "$pack_json")"
          candidate_integrity="$(node -e 'const value=JSON.parse(process.argv[1]); if (!Array.isArray(value) || value.length !== 1) process.exit(1); process.stdout.write(value[0].integrity)' "$pack_json")"
          test -f "$candidate_dir/$package_file"
          test -n "$candidate_integrity"
          test -z "$(git status --porcelain=v1)"
          {
            printf 'version=%s\n' "$package_version"
            printf 'integrity=%s\n' "$candidate_integrity"
            printf 'tarball=%s\n' "$candidate_dir/$package_file"
          } >> "$GITHUB_OUTPUT"

      - name: Publish or reconcile the exact candidate through npm Trusted Publishing
        id: publish
        shell: bash
        env:
          BUILDBEAT_PACKAGE_VERSION: ${{ steps.candidate.outputs.version }}
          BUILDBEAT_CANDIDATE_INTEGRITY: ${{ steps.candidate.outputs.integrity }}
          BUILDBEAT_CANDIDATE_TARBALL: ${{ steps.candidate.outputs.tarball }}
          BUILDBEAT_DIST_TAG: ${{ steps.policy.outputs.dist_tag }}
        run: BUILDBEAT_PUBLISH_OUTCOME_FILE="$GITHUB_OUTPUT" bash .github/scripts/publish-candidate.sh

      # A stable release also moves next, so `@next` never lags behind
      # `@latest`; the same OIDC identity does it (npm 11.21.0 or later, and
      # "Allow npm dist-tag" enabled for this trusted publisher on npmjs.com).
      - name: Point dist-tag next at a stable release
        if: steps.policy.outputs.dist_tag == 'latest'
        shell: bash
        env:
          BUILDBEAT_PACKAGE_VERSION: ${{ steps.candidate.outputs.version }}
          BUILDBEAT_PUBLISH_OUTCOME: ${{ steps.publish.outputs.outcome }}
        run: bash .github/scripts/follow-next.sh

  verify:
    name: Verify ${{ inputs.tag }} from npm
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - name: Check out the immutable published commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install the pinned verification npm CLI
        run: npm install --global npm@11.21.2

      - name: Verify exact official-registry artifact
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          test "$package_name" = "$BUILDBEAT_PACKAGE_NAME"
          test "$RELEASE_TAG" = "v$package_version"
          candidate_dir="$RUNNER_TEMP/buildbeat-verify-candidate"
          mkdir -p "$candidate_dir"
          pack_json="$(npm pack --json --pack-destination "$candidate_dir")"
          candidate_integrity="$(node -e 'const value=JSON.parse(process.argv[1]); if (!Array.isArray(value) || value.length !== 1) process.exit(1); process.stdout.write(value[0].integrity)' "$pack_json")"
          for attempt in $(seq 1 60); do
            published_version="$(npm view "$package_name@$package_version" version 2>/dev/null || true)"
            published_integrity="$(npm view "$package_name@$package_version" dist.integrity 2>/dev/null || true)"
            if [[ "$published_version" = "$package_version" && "$published_integrity" = "$candidate_integrity" ]]; then
              printf 'Verified exact %s@%s artifact on the official registry.\n' "$package_name" "$published_version"
              exit 0
            fi
            if [[ -n "$published_integrity" && "$published_integrity" != "$candidate_integrity" ]]; then
              echo "Published package integrity does not match the reviewed candidate." >&2
              exit 1
            fi
            printf 'Exact registry readback attempt %s is not complete yet.\n' "$attempt"
            sleep 10
          done
          echo "The exact reviewed artifact did not become readable from the official registry." >&2
          exit 1

      - name: Verify dist-tag routing
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 60); do
            latest_pointer="$(npm view "$package_name" dist-tags.latest 2>/dev/null || true)"
            next_pointer="$(npm view "$package_name" dist-tags.next 2>/dev/null || true)"
            if [[ "$package_version" == *-* ]]; then
              if [[ "$next_pointer" = "$package_version" && "$latest_pointer" != "$package_version" && -n "$latest_pointer" ]]; then
                printf 'Verified pre-release routing: next=%s, latest=%s untouched.\n' "$next_pointer" "$latest_pointer"
                exit 0
              fi
            else
              if [[ "$latest_pointer" = "$package_version" ]] \
                && BUILDBEAT_PACKAGE_VERSION="$package_version" bash .github/scripts/follow-next.sh --check; then
                printf 'Verified stable routing: latest=%s, next=%s.\n' "$latest_pointer" "$next_pointer"
                exit 0
              fi
            fi
            printf 'Dist-tag readback attempt %s is not complete yet.\n' "$attempt"
            sleep 10
          done
          echo "Published version is readable, but dist-tag routing does not match the release channel." >&2
          exit 1

      - name: Verify provenance metadata
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          encoded_package="${package_name/\//%2f}"
          expected_url="https://registry.npmjs.org/-/npm/v1/attestations/$encoded_package@$package_version"
          expected_predicate="https://slsa.dev/provenance/v1"
          for attempt in $(seq 1 60); do
            attestation_url="$(npm view "$package_name@$package_version" dist.attestations.url 2>/dev/null || true)"
            predicate_type="$(npm view "$package_name@$package_version" dist.attestations.provenance.predicateType 2>/dev/null || true)"
            if [[ "$attestation_url" = "$expected_url" && "$predicate_type" = "$expected_predicate" ]]; then
              printf 'Verified provenance metadata for %s@%s.\n' "$package_name" "$package_version"
              exit 0
            fi
            printf 'Provenance readback attempt %s is not complete yet.\n' "$attempt"
            sleep 10
          done
          echo "Published version is readable, but its expected provenance metadata is missing." >&2
          exit 1

      - name: Verify installed package and attestation signatures
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          release_probe="$(mktemp -d)"
          npm install --prefix "$release_probe" "$package_name@$package_version" \
            --registry=https://registry.npmjs.org/ --ignore-scripts --no-audit --no-fund
          package_dir="$release_probe/node_modules/$package_name"
          test "$(node "$package_dir/bin/buildbeat.js" --version)" = "$package_version"
          (
            cd "$release_probe"
            npm audit signatures --registry=https://registry.npmjs.org/
          )
