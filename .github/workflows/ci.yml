name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static:
    name: Static and documentation checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check Shell syntax
        run: bash -n .github/scripts/*.sh templates/scripts/*.sh tests/*.sh pilot/*.sh

      - name: Run ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          shellcheck -x .github/scripts/*.sh templates/scripts/*.sh tests/*.sh pilot/*.sh

      - name: Check documentation
        run: bash tests/check-docs.sh

      - name: Check Claude plugin marketplace package
        run: bash tests/plugin-marketplace.test.sh

      - name: Check commit whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git diff-tree --check --no-commit-id --root -r HEAD
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi

  behavior:
    name: Script behavior (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run script regression suite
        run: bash tests/test-scripts.sh

      - name: Run M-1 pilot driver regression suite
        run: bash tests/pilot-loop.test.sh

  cli:
    name: CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Run Node regression suite
        run: npm test

      - name: Audit package contents
        run: npm run pack:check
